<div class="container mt-4">
  <h2 class="mb-3">Filtro avanzado de productos</h2>

  <form [formGroup]="form()" class="row g-3 mb-4">
    <div class="col-md-4">
      <label class="form-label">Filtro</label>
      <select class="form-select" formControlName="campo">
        <option value="codigo">Codigo</option>
        <option value="nombre">Nombre</option>
        <option value="categoria">Categoria</option>
        <option value="precio">Precio</option>
      </select>
    </div>
    <div class="col-md-8">
      <label class="form-label">Busqueda</label>
      <input type="text" class="form-control" placeholder="Escribe para filtrar"
             formControlName="termino">
    </div>
  </form>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Categoría</th>
        <th>Precio</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of productos | filtroAvanzado:form().value.campo:form().value.termino">
        <td>{{ p.codigo }}</td>
        <td>{{ p.nombre }}</td>
        <td>{{ p.categoria ? p.categoria : 'Sin categoría' }}</td>
        <td>{{ p.precio | currency:'PEN' }}</td>
      </tr>
    </tbody>
  </table>

  @if ((productos | filtroAvanzado:form().value.campo:form().value.termino).length === 0) {
    <p class="text-center text-muted">No hay resultados</p>
  }
</div>
