<div class="container mt-4">
  <h2>Lista de productos</h2>

  <div class="alert alert-warning" *ngIf="!productos || productos.length === 0">
    No hay productos disponibles
  </div>

  <ul class="list-group" *ngIf="productos && productos.length > 0">
    <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let p of productos">
      <span>{{ p.nombre }} - S/ {{ p.precio }}</span>
      <span class="badge bg-danger" *ngIf="p.stock === 0">Sin Stock</span>
    </li>
  </ul>
</div>
